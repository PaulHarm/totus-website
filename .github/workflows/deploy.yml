name: Deploy zu STRATO

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Per SFTP zu STRATO hochladen
        env:
          SFTP_HOST: ${{ secrets.STRATO_HOST }}
          SFTP_USER: ${{ secrets.STRATO_USER }}
          SFTP_PASS: ${{ secrets.STRATO_PASSWORD }}
          REMOTE_DIR: ${{ secrets.STRATO_REMOTE_DIR }}
        run: |
          lftp -c "set sftp:auto-confirm yes; set net:max-retries 3; \
            open -u \"$SFTP_USER\",\"$SFTP_PASS\" sftp://$SFTP_HOST; \
            mirror --reverse --verbose --parallel=4 site/ \"$REMOTE_DIR\""
