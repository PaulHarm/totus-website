name: Deploy zu STRATO

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SFTP_HOST: 5020037797.ssh.w2.strato.hosting
  # Startverzeichnis des SFTP-Benutzers ist bereits /v6 (Ziel von totus.info)
  REMOTE_DIR: /

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Per SFTP zu STRATO hochladen
        env:
          SFTP_USER: ${{ secrets.STRATO_USER }}
          SFTP_PASS: ${{ secrets.STRATO_PASSWORD }}
        run: |
          lftp -c "set sftp:auto-confirm yes; set net:max-retries 2; \
            open -u \"$SFTP_USER\",\"$SFTP_PASS\" sftp://$SFTP_HOST; \
            mirror --reverse --verbose --parallel=4 site/ \"$REMOTE_DIR\""
